
<html>
<head>
    <title>Grocery E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-light bg-light">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Grocery Shop</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link"><button class="btn btn-success">Login</button></a>
                <a class="nav-link"><button class="btn btn-danger">Logout</button></a>
                <a class="nav-link"><button class="btn btn-primary">Home</button></a>
                <input type="text" class="rounded" placeholder="Search">
                <button class="btn btn-primary">Search</button>
            </div>

        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Categories -->

            <div class="col-3">

                <p class="h4">Categories</p>

                <p class="text-info">Vegetables</p>
                <p class="text-info">Fruits</p>
                <p class="text-info">Rice Items</p>
                <p class="text-info">Milk Products</p>
                <p class="text-info">Snacks Items</p>
                <p class="text-info">Drinks</p>

            </div>

            <!-- Products -->

            <div class="col-9">
                <div class="row">

                    <!-- Product 1 -->

                    <div class="col-3">
                        <div class="card">

                            <div class="card-body">

                                <img src="https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=300"
                                class="card-img-top" height="150">

                                <p class="card-title">Tomato</p>

                                <p class="card-text">Fresh Tomato 1kg</p>

                                <p class="h4 text-success">40₹</p>

                                <button class="btn btn-primary">Buy Now</button>

                            </div>
                        </div>
                    </div>

                    <!-- Product 2 -->

                    <div class="col-3">
                        <div class="card">

                            <div class="card-body">

                                <img src="https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=300"
                                class="card-img-top" height="150">

                                <p class="card-title">Apple</p>

                                <p class="card-text">Fresh Apple 1kg</p>

                                <p class="h4 text-success">120₹</p>

                                <button class="btn btn-primary">Buy Now</button>

                            </div>
                        </div>
                    </div>

                    <!-- Product 3 -->

                    <div class="col-3">
                        <div class="card">

                            <div class="card-body">

                                <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300"
                                class="card-img-top" height="150">

                                <p class="card-title">Rice</p>

                                <p class="card-text">Rice 5kg</p>

                                <p class="h4 text-success">300₹</p>

                                <button class="btn btn-primary">Buy Now</button>

                            </div>
                        </div>
                    </div>

                    <!-- Product 4 -->

                    <div class="col-3">
                        <div class="card">

                            <div class="card-body">

                                <img src="https://images.unsplash.com/photo-1563636619-e9143da7973b?w=300"
                                class="card-img-top" height="150">

                                <p class="card-title">Milk</p>

                                <p class="card-text">Fresh Milk 1 Litre</p>

                                <p class="h4 text-success">50₹</p>

                                <button class="btn btn-primary">Buy Now</button>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
